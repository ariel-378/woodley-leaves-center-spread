<main class="container">
  <section class="print-edition" aria-labelledby="print-heading">

      <div class="print-edition-flourish" aria-hidden="true">

      </div>
      <p class="print-edition-deck" id="cs-deck">Loading the games…</p>

    <div class="cs-controls">
      <label>Sort
        <select id="cs-sort">
          <option value="newest">Newest edition first</option>
          <option value="oldest">Oldest edition first</option>
        </select>
      </label>
      <label>Edition
        <select id="cs-edition"><option value="">All editions</option></select>
      </label>
    </div>

    <div id="cs-editions"></div>
  </section>
