<style>
  .cs-back { font-family: Georgia, serif; font-size: 14px; color: #555; text-decoration: none; display: inline-block; margin: 8px 0 24px; }
  .cs-back:hover { color: var(--ink, #111); }
  .article-body p { font-family: Georgia, serif; font-size: 16px; line-height: 1.7; margin: 0 0 1.1em; color: #1a1a1a; }

  /* ── Carousel ──────────────────────────────────────────────── */
  .carousel {
    position: relative;
    margin: 18px 0 24px;
    background: #000;
    border-radius: 4px;
    overflow: hidden;
  }
  .carousel-viewport {
    position: relative;
    width: 100%;
    aspect-ratio: 4 / 3;
    overflow: hidden;
  }
  .carousel-slide {
    position: absolute;
    inset: 0;
    opacity: 0;
    transition: opacity 360ms ease;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .carousel-slide.is-active { opacity: 1; }
  .carousel-slide img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
  }

  /* Prev / next arrows */
  .carousel-btn {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    width: 44px;
    height: 44px;
    border-radius: 50%;
    border: 1px solid rgba(255,255,255,0.5);
    background: rgba(0,0,0,0.45);
    color: #fff;
    font-size: 20px;
    line-height: 1;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 160ms ease, transform 160ms ease;
    font-family: Georgia, serif;
  }
  .carousel-btn:hover, .carousel-btn:focus-visible {
    background: rgba(0,0,0,0.7);
    outline: none;
  }
  .carousel-btn.prev { left: 12px; }
  .carousel-btn.next { right: 12px; }
  .carousel-btn:active { transform: translateY(-50%) scale(0.94); }

  /* Dots */
  .carousel-dots {
    display: flex;
    justify-content: center;
    gap: 8px;
    padding: 14px 8px;
    background: #fff;
  }
  .carousel-dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    border: 1px solid #888;
    background: transparent;
    padding: 0;
    cursor: pointer;
    transition: background 160ms ease, border-color 160ms ease;
  }
  .carousel-dot.is-active {
    background: var(--ink, #111);
    border-color: var(--ink, #111);
  }

  /* Caption */
  .carousel-caption {
    font-family: Georgia, serif;
    font-style: italic;
    font-size: 13px;
    color: #555;
    margin: -8px 0 0;
    line-height: 1.5;
    text-align: center;
    padding: 0 8px 4px;
  }

  /* Counter */
  .carousel-counter {
    position: absolute;
    top: 12px;
    right: 14px;
    font-family: Georgia, serif;
    font-size: 12px;
    letter-spacing: 0.5px;
    color: #fff;
    background: rgba(0,0,0,0.55);
    padding: 4px 10px;
    border-radius: 999px;
    pointer-events: none;
  }
</style>

<script>
(function () {
  const slides = Array.from(document.querySelectorAll('.carousel-slide'));
  const dots = Array.from(document.querySelectorAll('.carousel-dot'));
  const counter = document.getElementById('carousel-counter');
  const caption = document.getElementById('carousel-caption');
  const prevBtn = document.getElementById('carousel-prev');
  const nextBtn = document.getElementById('carousel-next');
  const viewport = document.getElementById('carousel-viewport');
  let index = 0;

  function show(next) {
    index = (next + slides.length) % slides.length;
    slides.forEach((s, i) => s.classList.toggle('is-active', i === index));
    dots.forEach((d, i) => {
      d.classList.toggle('is-active', i === index);
      d.setAttribute('aria-selected', i === index ? 'true' : 'false');
    });
    if (counter) counter.textContent = `${index + 1} / ${slides.length}`;
    if (caption) caption.innerHTML = slides[index].dataset.caption || '';
  }

  prevBtn.addEventListener('click', () => show(index - 1));
  nextBtn.addEventListener('click', () => show(index + 1));
  dots.forEach((d, i) => d.addEventListener('click', () => show(i)));

  // Keyboard arrows when the carousel is focused / hovered
  viewport.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowLeft') { e.preventDefault(); show(index - 1); }
    else if (e.key === 'ArrowRight') { e.preventDefault(); show(index + 1); }
  });
  viewport.tabIndex = 0;

  // Touch swipe
  let touchX = null;
  viewport.addEventListener('touchstart', (e) => { touchX = e.changedTouches[0].clientX; }, { passive: true });
  viewport.addEventListener('touchend', (e) => {
    if (touchX === null) return;
    const dx = e.changedTouches[0].clientX - touchX;
    if (Math.abs(dx) > 40) show(dx < 0 ? index + 1 : index - 1);
    touchX = null;
  }, { passive: true });
})();
</script>
